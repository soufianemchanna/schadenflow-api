spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: ${BREVO_USERNAME}
    password: ${BREVO_API_KEY}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

brevo:
  sender-email: ${BREVO_SENDER_EMAIL}
  sender-name: Schadenflow Team